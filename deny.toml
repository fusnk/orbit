# Checked against the locked graph's SPDX declarations. Prefer permissive
# alternatives in dual-licensed dependencies. Every advisory exception below
# names why it doesn't reach Orbit and is revisited when its parent updates.
[licenses]
confidence-threshold = 0.93
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib",
    "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0",
    "GPL-3.0-only", "GPL-3.0-or-later",
]
unused-allowed-license = "allow"

# alass-core (subtitle sync) declares the deprecated SPDX id "GPL-3.0", which
# means GPL-3.0-only; compatible with Orbit's GPL-3.0-or-later.
[[licenses.clarify]]
crate = "alass-core"
expression = "GPL-3.0-only"
license-files = []

[advisories]
# Unmaintained crates are reported for Orbit's own dependencies; the ones deep
# in Tauri's tree (unic-* via urlpattern, proc-macro-error via glib-macros)
# can only move when Tauri does.
unmaintained = "workspace"
ignore = [
    # ringbuf 0.4: double free only when an element's Drop panics. Its one user,
    # librqbit-utp 0.7 (latest), stores u8, which has no Drop. Drop when librqbit
    # moves to ringbuf >= 0.5.2.
    { id = "RUSTSEC-2026-0293", reason = "u8 elements only (librqbit-utp); no Drop to panic" },
    # glib 0.18 VariantStrIter unsoundness: Linux-only, pulled in by Tauri's GTK 0.18
    # (tray/WebKitGTK); Orbit never iterates GVariant strings.
    { id = "RUSTSEC-2024-0429", reason = "Tauri's GTK 0.18 on Linux; VariantStrIter unused" },
]
