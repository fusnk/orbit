[package]
name = "orbit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
# An independent workspace keeps the fuzz crate out of ordinary Orbit builds.
[workspace]
[dependencies]
libfuzzer-sys = "0.4"
orbit = { path = ".." }

[[bin]]
name = "m3u"
path = "fuzz_targets/m3u.rs"
