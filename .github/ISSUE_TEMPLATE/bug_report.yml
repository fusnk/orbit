# JSON-compatible YAML: validated with Python's built-in JSON parser.
{
  "name": "Bug report",
  "description": "Report something that is not working in Orbit.",
  "title": "[Bug]: ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Remove API keys, passwords, tokens, private URLs and personal information from screenshots, logs and everything you paste here. Orbit includes no content or content addons."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Orbit version",
        "placeholder": "For example: 0.1.0"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "os",
      "attributes": {
        "label": "Operating system and version",
        "placeholder": "For example: Windows 11 24H2"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "source",
      "attributes": {
        "label": "Source type",
        "options": [
          "Addon",
          "Live TV / IPTV",
          "Media server (Jellyfin / Plex)",
          "Local file",
          "Debrid / My cloud",
          "Not source-related"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce",
        "description": "Tell us what you clicked or pressed, starting from opening Orbit."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "Actual behavior",
        "description": "Include an error message or a redacted screenshot if useful."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Privacy check",
        "options": [
          {
            "label": "I removed credentials, tokens, private URLs and personal information from this report.",
            "required": true
          }
        ]
      }
    }
  ]
}
