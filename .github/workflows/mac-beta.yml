# JSON-style YAML, like ci.yml. Publishes a Mac beta: the universal .dmg a macOS run
# built (macos.yml with "universal") goes up as a pre-release under a mac-beta-<n>
# tag on the commit that run built. Never marked latest, so the release the updater
# and the Download page follow stays where it is. Run by hand.
{
  "name": "Mac beta",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "run_id": {
          "description": "The macOS run whose .dmg to publish",
          "type": "string",
          "required": true
        },
        "tag": {
          "description": "Its tag, mac-beta-<n>",
          "type": "string",
          "required": true
        },
        "title": {
          "description": "The release's title",
          "type": "string",
          "required": true
        },
        "notes": {
          "description": "What's new in it",
          "type": "string",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Publish the .dmg as a pre-release",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "GH_REPO": "${{ github.repository }}",
            "RUN_ID": "${{ inputs.run_id }}",
            "TAG": "${{ inputs.tag }}",
            "TITLE": "${{ inputs.title }}",
            "NOTES": "${{ inputs.notes }}"
          },
          # A v* tag would start the release pipeline: only mac-beta-<n> here.
          "run": "[[ \"$TAG\" =~ ^mac-beta-[0-9]+$ ]] || { echo \"Tag must be mac-beta-<n>\"; exit 1; }\n[[ \"$RUN_ID\" =~ ^[0-9]+$ ]] || { echo \"Not a run id\"; exit 1; }\n[ \"$(gh run view \"$RUN_ID\" --json workflowName -q .workflowName)\" = macOS ] || { echo \"Not a macOS run\"; exit 1; }\nSHA=\"$(gh run view \"$RUN_ID\" --json headSha -q .headSha)\"\ngh run download \"$RUN_ID\" -n \"macos-dmg-$RUN_ID\" -D dmg\nls -la dmg\ngh release create \"$TAG\" dmg/*.dmg --prerelease --latest=false --target \"$SHA\" --title \"$TITLE\" --notes \"$NOTES\""
        }
      ]
    }
  }
}
