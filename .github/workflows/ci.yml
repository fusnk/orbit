# JSON-style YAML. The "# vX.Y.Z" after each pinned action makes it YAML only:
# validate with a YAML parser. Actions are pinned to a full commit SHA so a moved
# tag can't change what runs here; Dependabot (.github/dependabot.yml) bumps them.
# tauri-build requires both pinned Windows resources even during Rust checks.
# Unit tests run shuffled so a test that only passes after another fails here; the
# log's "Running tests with seed" line replays that order (--sequence.seed=<n>).
# Layout tests (tests/ui, Playwright) run the real pages in Chromium with Rust faked; about
# 10-13 min. Allowed to fail for now, until they've proven steady on CI's machines.
{
  "name": "CI",
  "on": {
    "push": {},
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "schedule": [
      {
        "cron": "23 4 * * 1"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "check": {
      "runs-on": "windows-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", # v6.1.0
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1", # v4.3.0
          "with": {
            "version": "12.6.0"
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", # v6.5.0
          "with": {
            "node-version": "24",
            "cache": "pnpm"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec", # stable (branch, as of 2026-10-22)
          "with": {
            "components": "clippy"
          }
        },
        {
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0", # v2.9.3
          "with": {
            "workspaces": "src-tauri -> target",
            "save-if": "${{ github.event_name == 'push' }}"
          }
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Prepare required Windows resources",
          "run": "pnpm run setup:libmpv\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\npnpm run setup:ytdlp"
        },
        {
          "run": "pnpm run typecheck"
        },
        {
          "run": "pnpm run lint"
        },
        {
          "name": "Unit tests, in a random order",
          "run": "pnpm test --sequence.shuffle"
        },
        {
          "run": "cargo check --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "run": "cargo test --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "run": "cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings"
        }
      ]
    },
    "linux": {
      "continue-on-error": true,
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "steps": [
        {
          "with": {
            "persist-credentials": false
          },
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
        },
        {
          "name": "Install GTK, WebKitGTK and system playback libraries",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libgl-dev libegl-dev"
        },
        {
          "with": {
            "version": "12.6.0"
          },
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1" # v4.3.0
        },
        {
          "with": {
            "cache": "pnpm",
            "node-version": "24"
          },
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38" # v6.5.0
        },
        {
          "with": {
            "components": "clippy"
          },
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec" # stable (branch, as of 2026-10-22)
        },
        {
          "with": {
            "workspaces": "src-tauri -> target",
            "save-if": "${{ github.event_name == 'push' }}"
          },
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Verify system libmpv",
          "run": "pnpm run setup:libmpv"
        },
        {
          "run": "cargo check --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "run": "cargo test --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "run": "cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings"
        }
      ]
    },
    "macos": {
      "continue-on-error": true,
      "runs-on": "macos-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "with": {
            "persist-credentials": false
          },
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
        },
        {
          "with": {
            "components": "clippy"
          },
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec" # stable (branch, as of 2026-10-22)
        },
        {
          "with": {
            "workspaces": "src-tauri -> target",
            "save-if": "${{ github.event_name == 'push' }}"
          },
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
        },
        {
          "run": "cargo check --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "run": "cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings"
        }
      ]
    },
    "layout": {
      "continue-on-error": true,
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", # v6.1.0
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1", # v4.3.0
          "with": {
            "version": "12.6.0"
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", # v6.5.0
          "with": {
            "node-version": "24",
            "cache": "pnpm"
          }
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Install the Chromium the pinned Playwright expects",
          "run": "pnpm exec playwright install --with-deps chromium-headless-shell"
        },
        {
          "name": "Layout tests",
          "run": "pnpm test:ui --workers=2"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9", # v4.6.2
          "name": "Upload what a failing layout test saw",
          "if": "${{ failure() }}",
          "with": {
            "if-no-files-found": "ignore",
            "name": "layout-test-results-${{ github.run_id }}",
            "path": "test-results/",
            "retention-days": 14
          }
        }
      ]
    },
    "notices": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", # v6.1.0
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1", # v4.3.0
          "with": {
            "version": "12.6.0"
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", # v6.5.0
          "with": {
            "node-version": "24",
            "cache": "pnpm"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec" # stable (branch, as of 2026-10-22)
        },
        {
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Fetch every crate, so cargo metadata can run offline",
          "run": "cargo fetch --locked --manifest-path src-tauri/Cargo.toml"
        },
        {
          "name": "THIRD-PARTY-NOTICES.txt matches the dependencies",
          "run": "pnpm run notices\ngit diff --exit-code THIRD-PARTY-NOTICES.txt || { echo '::error file=THIRD-PARTY-NOTICES.txt::Out of date: run pnpm run notices and commit the result.'; exit 1; }"
        }
      ]
    },
    "security": {
      "timeout-minutes": 30,
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", # v6.1.0
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec" # stable (branch, as of 2026-10-22)
        },
        {
          "uses": "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          "with": {
            "key": "security-tools-${{ runner.os }}-audit-deny-v1",
            "path": "~/.cargo/security-tools"
          }
        },
        {
          "name": "Install isolated security tools",
          "run": "test -x ~/.cargo/security-tools/bin/cargo-audit || cargo install cargo-audit --locked --root ~/.cargo/security-tools\ntest -x ~/.cargo/security-tools/bin/cargo-deny || cargo install cargo-deny --locked --root ~/.cargo/security-tools\necho \"$HOME/.cargo/security-tools/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "RustSec audit",
          "run": "cargo audit --file src-tauri/Cargo.lock"
        },
        {
          "name": "Licenses and advisories",
          "run": "cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check licenses advisories",
          "if": "${{ always() }}"
        }
      ]
    },
    "fuzz": {
      "timeout-minutes": 120,
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", # v6.1.0
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install native build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libgl-dev libegl-dev"
        },
        {
          "uses": "dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04" # nightly (branch, as of 2026-10-22)
        },
        {
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0", # v2.9.3
          "with": {
            "workspaces": "src-tauri/fuzz -> target"
          }
        },
        {
          "name": "Install cargo-fuzz",
          "run": "cargo install cargo-fuzz --locked"
        },
        {
          "working-directory": "src-tauri",
          "name": "Fuzz every registered target",
          "continue-on-error": true,
          "run": "mkdir -p fuzz/artifacts\ncargo +nightly fuzz list > fuzz/targets.txt\nfailed=0\nwhile IFS= read -r target; do\n  test -n \"$target\" || continue\n  echo \"::group::Fuzz $target\"\n  cargo +nightly fuzz run \"$target\" -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048 -timeout=10 || failed=1\n  echo \"::endgroup::\"\ndone < fuzz/targets.txt\nexit \"$failed\""
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9", # v4.6.2
          "name": "Upload synthetic crashes and target list",
          "with": {
            "if-no-files-found": "ignore",
            "name": "fuzz-crashes-${{ github.run_id }}",
            "path": "src-tauri/fuzz/artifacts/\nsrc-tauri/fuzz/targets.txt",
            "retention-days": 14
          },
          "if": "${{ always() }}"
        }
      ],
      "continue-on-error": true,
      "if": "${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}"
    }
  }
}
